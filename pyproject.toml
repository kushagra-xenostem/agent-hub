[project]
name = "ares"
version = "0.1.0"
description = "ARES: Agent Reliability, Evaluation & Security platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-http>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
baseline = ["crewai>=0.80"]

[project.scripts]
ares = "ares.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ares"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real LLM API (run with: pytest -m live)"]
addopts = "-m 'not live'"
